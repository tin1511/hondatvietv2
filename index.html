    <script>
      (function() {
        // Handle Vite HMR WebSocket in sandboxed environment where HMR is disabled
        if (typeof window !== 'undefined' && window.WebSocket) {
          var NativeWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            var isHmr = false;
            try {
              if (protocols === 'vite-hmr' || (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1)) {
                isHmr = true;
              } else if (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('/@vite') !== -1)) {
                isHmr = true;
              }
            } catch (err) {}

            if (isHmr) {
              var listeners = {};
              var dummyWs = {
                readyState: 1, // OPEN
                binaryType: 'blob',
                bufferedAmount: 0,
                extensions: '',
                protocol: 'vite-hmr',
                url: String(url),
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
                send: function() {},
                close: function() {
                  this.readyState = 3; // CLOSED
                  if (typeof this.onclose === 'function') {
                    try { this.onclose({ wasClean: true, code: 1000, reason: '' }); } catch (e) {}
                  }
                },
                addEventListener: function(type, fn) {
                  if (!listeners[type]) listeners[type] = [];
                  listeners[type].push(fn);
                },
                removeEventListener: function(type, fn) {
                  if (!listeners[type]) return;
                  listeners[type] = listeners[type].filter(function(cb) { return cb !== fn; });
                },
                dispatchEvent: function() { return true; }
              };
              setTimeout(function() {
                if (typeof dummyWs.onopen === 'function') {
                  try { dummyWs.onopen({ type: 'open' }); } catch (e) {}
                }
                if (listeners['open']) {
                  listeners['open'].forEach(function(fn) {
                    try { fn({ type: 'open' }); } catch (e) {}
                  });
                }
              }, 10);
              return dummyWs;
            }
            return new NativeWebSocket(url, protocols);
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.CONNECTING = NativeWebSocket.CONNECTING;
          window.WebSocket.OPEN = NativeWebSocket.OPEN;
          window.WebSocket.CLOSING = NativeWebSocket.CLOSING;
          window.WebSocket.CLOSED = NativeWebSocket.CLOSED;
        }

        // Suppress any remaining benign Vite WebSocket or SendBeforeConnect error logs
        function isViteHmrError(str) {
          if (!str || typeof str !== 'string') return false;
          return str.indexOf('WebSocket closed without opened') !== -1 ||
                 str.indexOf('[vite] WebSocket') !== -1 ||
                 str.indexOf('SendBeforeConnectError') !== -1 ||
                 str.indexOf('send was called before connect') !== -1 ||
                 str.indexOf('vite-pwa-plugin:dev-ready') !== -1;
        }

        var origConsoleError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            var item = arguments[i];
            var str = (item && (item.message || item.stack || String(item))) || '';
            if (isViteHmrError(str)) {
              return;
            }
          }
          return origConsoleError.apply(console, arguments);
        };
        window.addEventListener('error', function(e) {
          var msg = (e && (e.message || (e.error && (e.error.message || e.error.stack)))) || '';
          if (isViteHmrError(String(msg))) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          var reason = (e && e.reason && (e.reason.message || e.reason.stack || String(e.reason))) || '';
          if (isViteHmrError(String(reason))) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
